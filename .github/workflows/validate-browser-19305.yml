name: Verify pack browser on Windows
on:
  push:
    branches: [validation/19305-pack-browser-ba5bbef095]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '128'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ba5bbef0950055259a7afc7cb2ccfd5d12d3fecd
          persist-credentials: false
      - name: Build portable Windows launcher with embedded shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne 'ba5bbef0950055259a7afc7cb2ccfd5d12d3fecd') { throw 'Unexpected checkout' }
          $pin = (Get-Content tools/ci/rust-version -Raw).Trim()
          rustup toolchain install $pin --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP hzt
          cargo "+$pin" build --release --manifest-path launcher/Cargo.toml --locked --bin horizon-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path verified
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR release/horizon-launcher.exe) verified
          $checksum = (Get-FileHash verified/horizon-launcher.exe -Algorithm SHA256).Hash
          @{ source = 'ba5bbef0950055259a7afc7cb2ccfd5d12d3fecd'; sha256 = $checksum; rust = $pin } | ConvertTo-Json | Set-Content verified/source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-ba5bbef0950055259a7afc7cb2ccfd5d12d3fecd
          path: verified/
          retention-days: 3
          if-no-files-found: error
